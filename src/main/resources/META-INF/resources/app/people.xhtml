<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core" xmlns:ui="jakarta.faces.facelets"
                xmlns:p="primefaces" template="/template/template.xhtml">
<ui:define name="title">
    DataTable <span class="subitem">Crud</span>
</ui:define>

<ui:define name="description">
This samples demonstrates a CRUD implementation using various PrimeFaces components.
</ui:define>

<ui:param name="documentationLink" value="/components/datatable"/>
<ui:param name="widgetLink" value="DataTable-1"/>

    <ui:define name="implementation">

        <div class="card crud-demo">
            <h:form id="form">
                <p:growl id="messages" showDetail="true"/>
                <p:toolbar>
                    <p:toolbarGroup>
                        <p:commandButton value="New" icon="pi pi-plus" actionListener="#{dtPeopleView.openNew}"
                                         update=":dialogs:manage-person-content"
                                         oncomplete="PF('managePeopleDialog').show()"
                                         styleClass="ui-button-success" style="margin-right: .5rem">
                            <p:resetInput target=":dialogs:manage-person-content"/>
                        </p:commandButton>
                        <p:commandButton id="delete-people-button" value="#{dtPeopleView.deleteButtonMessage}"
                                         icon="pi pi-trash" actionListener="#{dtPeopleView.deleteSelectedPeople}"
                                         styleClass="ui-button-danger" disabled="#{!dtPeopleView.hasSelectedPeople()}"
                                         update="@this">
                            <p:confirm header="Confirmation" message="Delete the selected Person?"
                                       icon="pi pi-exclamation-triangle"/>
                        </p:commandButton>
                    </p:toolbarGroup>
                    <p:toolbarGroup align="right">
                        <p:fileUpload mode="simple" skinSimple="true" label="Import" chooseIcon="pi pi-download"/>
                        <p:commandButton value="Export" icon="pi pi-upload" styleClass="ui-button-help" ajax="false">
                            <p:dataExporter type="pdf" target="dt-people" fileName="people"/>
                        </p:commandButton>
                    </p:toolbarGroup>
                </p:toolbar>
                <p:dataTable id="people" widgetVar="dtPeople" var="person" value="#{dtPeopleView.people}"
                             reflow="true" styleClass="people-table" selectionMode="multiple"
                             selection="#{dtPeopleView.selectedPeople}"
                             rowKey="#{person.id}" paginator="true" rows="10" selectionRowMode="add"
                             paginatorPosition="bottom">
                    <f:facet name="header">
                        <div class="people-table-header">
                            <span style="font-weight: bold">Person</span>
                            <span class="filter-container ui-input-icon-left"> <i class="pi pi-search"></i>
                        <p:inputText id="globalFilter" onkeyup="PF('people').filter()"
                                     placeholder="Search"/>
                    </span>
                        </div>
                    </f:facet>
                    <p:column headerText="Name">
                        <h:outputText value="#{person.name}"/>
                    </p:column>
                    <p:column headerText="Birthdate">
                            <h:outputText value="#{person.birthDate}"/>
                    </p:column>
                    <p:column headerText="Create At">
                            <h:outputText value="#{person.createdAt}"/>
                    </p:column>
                    <p:column headerText="Create By">
                        <h:outputText value="#{person.createdBy}"/>
                    </p:column>
                    <p:column headerText="Update At">
                        <h:outputText value="#{person.updatedAt}"/>
                    </p:column>
                    <p:column headerText="Update By">
                        <h:outputText value="#{person.updatedBy}"/>
                    </p:column>
                </p:dataTable>
            </h:form>
            <h:form id="dialogs">
                <p:dialog header="Person Details" showEffect="fade" modal="true" widgetVar="managePeopleDialog" responsive="true">
                    <p:outputPanel id="manage-person-content" class="ui-fluid">
                        <p:outputPanel>
                            <div class="field">
                                <p:outputLabel for="name">Name</p:outputLabel>
                                <p:inputText id="name" value="#{dtPeopleView.selectedPeople.name}" required="true"/>
                            </div>
                            <div class="field">
                                <p:outputLabel for="birthDate">BirthDate</p:outputLabel>
                                <p:inputMask id="birthDate" value="#{dtPeopleView.selectedPeople.birthDate}" mask="99/99/9999" />
                            </div>
                        </p:outputPanel>
                    </p:outputPanel>
                    <f:facet name="footer">
                        <p:commandButton value="Save" icon="pi pi-check" actionListener="#{dtPeopleView.savePerson}"
                                         update="manage-person-content" process="manage-person-content @this"/>
                        <p:commandButton value="Cancel" icon="pi pi-times" onclick="PF('managePeopleDialog').hide()"
                                         class="ui-button-secondary" type="button"/>
                    </f:facet>
                </p:dialog>
                <p:confirmDialog widgetVar="deletePersonDialog" showEffect="fade" width="300"
                                 message="Delete the person?" header="Confirm" severity="warn">
                    <p:commandButton value="Yes" icon="pi pi-check" actionListener="#{dtPeopleView.deletePerson}"
                                     process="@this" update=":form:delete-people-button"
                                     oncomplete="PF('deletePersonDialog').hide()"/>
                    <p:commandButton value="No" type="button" styleClass="ui-button-secondary" icon="pi pi-times"
                                     onclick="PF('deletePersonDialog').hide()"/>
                </p:confirmDialog>

                <p:confirmDialog global="true" showEffect="fade" width="300">
                    <p:commandButton value="Yes" type="button" styleClass="ui-confirmdialog-yes" icon="pi pi-check"/>
                    <p:commandButton value="No" type="button" styleClass="ui-confirmdialog-no ui-button-secondary"
                                     icon="pi pi-times"/>
                </p:confirmDialog>
            </h:form>
        </div>

    </ui:define>

</ui:composition>
